name: Deploy Infra

on:
  workflow_dispatch:
  push:
    branches:
      - feat/functions-notifications-and-expiration

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: infrastructure/terraform/complete
        run: terraform init -upgrade

      - name: Terraform Plan
        working-directory: infrastructure/terraform/complete
        run: terraform plan -out=tf.plan
        env:
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_name_prefix: ${{ vars.NAME_PREFIX }}
          TF_VAR_location: ${{ vars.AZURE_LOCATION }}
          TF_VAR_slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          TF_VAR_user_upns: ${{ vars.USER_UPNS_JSON }}

      - name: Terraform Apply
        if: github.ref == 'refs/heads/feat/functions-notifications-and-expiration'
        working-directory: infrastructure/terraform/complete
        run: terraform apply -auto-approve tf.plan

  functions:
    needs: terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip Functions
        run: |
          cd src/functions
          python3 -m pip install -r requirements.txt -t ./
          zip -r ../../package.zip .
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy to Function App
        uses: azure/functions-action@v1
        with:
          app-name: ${{ vars.FUNCTION_APP_NAME }}
          package: ./package.zip
